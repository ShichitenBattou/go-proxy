services:
  api:
    build:
      context: .
      target: dev
    ports:
      - "8081:8081"
    volumes:
      - ${HOST_WORKSPACE}/api:/app
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/postgres
      - KEYCLOAK_ISSUER=http://keycloak:8082/realms/myrealm
      - KEYCLOAK_AUDIENCE=bff
      - KEYCLOAK_JWKS_URI=http://keycloak:8082/realms/myrealm/protocol/openid-connect/certs
      - STAGE=dev
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17.4
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - api_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  api_pgdata:
